name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATA_SOURCE: mock
      NEXTAUTH_SECRET: ci-only-not-production
      # Prisma validate potřebuje syntakticky platnou URL, ale k databázi se nepřipojuje.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - name: Check production migration status
        if: ${{ env.PRODUCTION_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ env.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate status
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-contracts:
    runs-on: ubuntu-latest
    env:
      DATA_SOURCE: mock
      NEXTAUTH_SECRET: ci-only-not-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
